<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Execution Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding-top: 50px; }
        .status-ok { color: #155724; background-color: #d4edda; border-color: #c3e6cb; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .status-ko { color: #721c24; background-color: #f8d7da; border-color: #f5c6cb; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.05); border: none; }
    </style>
</head>
<body>

<div class="container">
    <table>
        <tbody>
        <tr th:each="line : ${testReport}">
            <td th:each="test : ${line}">
                <span th:text="${test.testName}"></span>
                <span th:text="${test.testStatus}"></span>
                <span th:text="${test.testDetails}"></span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
