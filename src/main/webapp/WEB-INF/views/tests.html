<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Execution Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding-top: 50px; }
        /* Couleurs pour le texte et fond des cellules de statut */
        .status-ok { color: #155724; background-color: #d4edda !important; font-weight: bold; text-align: center; }
        .status-ko { color: #721c24; background-color: #f8d7da !important; font-weight: bold; text-align: center; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; border-radius: 10px; }
        .table thead { background-color: #212529; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4">
        <h2 class="mb-4 text-center">Backend Facade Test Results</h2>

        <table class="table table-bordered table-striped">
            <thead>
            <tr>
                <th>Test Name</th>
                <th>Status</th>
                <th>Execution Details</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="test : ${testReport}">
                <td th:text="${test.testName}">Test Name</td>

                <td th:text="${test.testStatus}"
                    th:classappend="${test.testStatus == 'OK' ? 'status-ok' : 'status-ko'}">
                    STATUS
                </td>

                <td th:text="${test.testDetails}">Details about the test execution</td>
            </tr>

            <tr th:if="${#lists.isEmpty(testReport)}">
                <td colspan="3" class="text-center text-muted">No tests have been executed.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
