<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Welcome to fake leboncoin</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: my-navbar}"></div>

<h1>Offres Leboincoine</h1>

<div th:each="o : ${offers}">
    <h4 th:text="'Offer: '+${o.name()}"></h4>
    <p th:text="'Created at: '+${o.creation_date()}" style="color:darkblue"></p>
    <p th:text="'Organisation: '+${o.org_name()}" style="color:darkblue"></p>
    <p th:text="'Status: '+${o.status()}"style="color:red"></p>
    <a th:if="${courant != null}" th:href="@{/member/offer/detail/}+${o.id()}">Details</a>
</div>

</body>
</html>
