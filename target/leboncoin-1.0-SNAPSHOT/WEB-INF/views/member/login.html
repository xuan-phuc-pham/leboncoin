<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to fake leboncoin</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: my-navbar}"></div>

<h1>Login Leboincoine</h1>

<p th:if="${error != null}" th:text="${error}" style="color:red" />


<form method="post" name="idform">
    <p>Login :<input type="text" name="login"/></p>
    <p>Password : <input type="password" name="password"/></p>
    <p>
        <button type="button" th:attr="onclick=|document.idform.action='@{/member/login}';document.idform.submit();|">Login</button>
        &nbsp;
        <button type="button" th:attr="onclick=|document.idform.action='@{/register}';document.idform.submit();|">Register</button>
    </p>
</form>

<a th:href="@{/responsable/login}">
    <button type="button">Login as Responsable</button>
</a>

</body>
</html>
